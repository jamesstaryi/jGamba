<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine’s Day Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Main Game Area -->
    <div class="game-area">
      <h1>💕 Valentine's Day Clicker 💕</h1>
      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">Hearts</div>
          <div class="stat-value" id="cookie-count">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Per Second</div>
          <div class="stat-value" id="per-second">0</div>
        </div>
      </div>
      
      <!-- Cookie Button -->
      <button id="cookie-btn" class="cookie-button">❤️</button>
      
      <!-- Hidden Button -->
      <button id="hidden-btn" class="hidden-button">🎉</button>
      
      <!-- Invisible Cheat Code Button -->
      <button id="cheat-btn" class="cheat-button"></button>
      
      <!-- Hidden Video -->
      <video id="meme-video" style="display: none;" controls>
        <source src="meme.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      
      <!-- Floaty text for clicks -->
      <div id="floaty-container"></div>
    </div>

    <!-- Shop Area -->
    <div class="shop">
      <h2>💗 Shop 💗</h2>
      <div class="upgrades" id="upgrades-container"></div>
    </div>
  </div>

  <!-- Hidden Video Modal -->
  <div id="video-modal" style="display: none;">
    <video id="meme-video" controls muted>
      <source src="meme.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <script src="script.js"></script>
</body>
</html>
